[project]
name = "eco"
version = "0.1.0"
description = "Context optimization under a token budget: ECO vs top-k, MMR, ReFind and MemoryCPT on LongMemEval-S"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain-core==1.6.6",
    "langchain-openai==1.6.6",
    "langchain-ollama==1.1.0",
    "tiktoken==0.14.0",
    "pyyaml==6.0.3",
    "numpy==2.4.6",
    "python-dotenv==1.2.3",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.0.1",
    "langchain-nvidia-ai-endpoints==1.4.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "systems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
